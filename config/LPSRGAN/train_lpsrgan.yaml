model:
  name: lpsrgan
  args:
    num_blocks: 3
    dropout_prob: 0.5

optimizer:
  name: adam
  args: 
    lr: 1.e-4
    betas: [0.5, 0.555]

ema:
  decay: 0.999            # 0.999 is a good value for small datasets / few steps
  use_warmup: True        # EMA tracks the model closely early on
  warmup_power: 0.75      # reaches 0.999 at ~10k steps
  update_after_step: 0
  device: null            # null = same device as the generator (cuda)

func_train: lpsrgan_train
func_val: lpsrgan_val
tag_view: MISR
alphabet: "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ"

train_dataset:
  dataset:
    name: multi_image
    args:
      path_split: /path/to/your/split.txt
      phase: training
      
  wrapper:
    name: lpsrgan
    args:
      imgW: 48
      imgH: 32
      aug: True
      image_aspect_ratio: 1.5
      background: (127, 127, 127)
  batch: 32

val_dataset:
  dataset:
    name: multi_image
    args:
      path_split: /path/to/your/split.txt
      phase: validation

  wrapper:
    name: lpsrgan
    args:
      imgW: 48
      imgH: 32
      aug: False
      image_aspect_ratio: 1.5
      background: (127, 127, 127)
  batch: 32

epoch_max: 1
CM: False

loss: 
  name: lpsrganLoss
  args:
    load: ./RodoSol-SR
    weight: null
    size_average: null
    
early_stopper:
  patience: 50
  min_delta: 0
  counter: 0

reduce_on_plateau:
  mode: 'min'
  factor: 0.5
  patience: 10
  min_lr: 1.e-7
  #verbose: True

epoch_max: 1
epoch_save: 1
resume: 
#/best_model_Epoch_116.pth

