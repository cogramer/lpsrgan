model:
  name: lpsrgan
  load: /path/to/your/model.pth
  args:
    num_blocks: 3
    dropout_prob: 0.5

use_ema: True

model_ocr:
  name: GPLPR
  load: /path/to/your/ocr_model.pth
  args:
    alphabet: "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ"
    nc: 3
    K: 7
    isSeqModel: True
    head: 2
    inner: 256
    isl2Norm: True



test_dataset:
  dataset:
    name: multi_image
    args:
      path_split: /path/to/your/split.txt
      phase: testing

  wrapper:
    name: SR_multi_image
    args:
      imgW: 48
      imgH: 32
      aug: False
      image_aspect_ratio: 1.5
      background: (127, 127, 127)
      in_images: 1
      test: True
  batch: 1

